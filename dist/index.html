<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPFS Browser</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --surface: #eceef2;
            --surface-container: #f6f7f9;
            --surface-bright: #ffffff;
            --outline: #e2e6ec;
            --outline-strong: #c6ccd5;
            --on-surface: #191c20;
            --on-surface-variant: #5b636e;
            --on-surface-dim: #8a919c;
            --primary: #2264d1;
            --primary-hover: #1b57bd;
            --primary-container: #eaf1fd;
            --on-primary-container: #123a86;
            --success: #1f8a4c;
            --success-bg: #e2f3e8;
            --success-text: #0b5a2e;
            --warning: #a9680c;
            --warning-bg: #f8ecd4;
            --warning-text: #6e430a;
            --error: #c0362c;
            --error-bg: #fadedb;
            --error-text: #7a1c16;
            --neutral-chip-bg: #eceef2;
            --neutral-chip-text: #5b636e;
            --font-body: 'Roboto', 'Segoe UI', system-ui, sans-serif;
            --font-mono: 'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
            --radius-base: 6px;
            --radius-card: 8px;
            --radius-pill: 20px;
            --mui-palette-background-default: var(--surface);
            --mui-palette-background-paper: var(--surface-bright);
            --mui-palette-text-primary: var(--on-surface);
            --mui-palette-text-secondary: var(--on-surface-variant);
            --mui-palette-divider: var(--outline);
            --mui-palette-primary-main: var(--primary);
            --mui-palette-success-main: var(--success);
            --mui-palette-warning-main: var(--warning);
            --mui-shape-border-radius: var(--radius-base);
            --mui-spacing-0-5: 4px;
            --mui-spacing-1: 8px;
            --mui-spacing-1-5: 12px;
        }

        /*
        Dark token set, reserved for a later theme swap:
        --surface: #14171c;
        --surface-container: #1b1f25;
        --surface-bright: #21262d;
        --outline: #2b323b;
        --on-surface: #e6e9ee;
        --on-surface-variant: #aeb6c2;
        --primary: #4dabf7;
        --success: #51cf66;
        --warning: #f0a63c;
        --error: #ff6b5e;
        */

        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; max-width: 100%; overflow-x: clip; }
        body {
            min-height: 100vh;
            background: var(--surface);
            color: var(--on-surface);
            font: 13px/1.45 var(--font-body);
            -webkit-font-smoothing: antialiased;
        }
        button, input, textarea { font: inherit; }
        button { letter-spacing: 0; }
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-thumb {
            background: var(--outline-strong);
            border: 2px solid transparent;
            border-radius: var(--radius-base);
            background-clip: padding-box;
        }

        .mpfs-shell { min-height: 100vh; background: var(--surface); }
        .app-bar {
            position: sticky;
            top: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 14px;
            height: 56px;
            min-width: 0;
            padding: 0 16px;
            border-bottom: 1px solid var(--outline);
            background: var(--surface-bright);
        }
        .brand-lockup { display: flex; align-items: center; gap: 9px; min-width: 0; }
        .brand-mark {
            width: 26px;
            height: 26px;
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-base);
            background: var(--primary);
            color: #fff;
            font-weight: 700;
            transform: rotate(45deg);
        }
        .brand-mark span { transform: rotate(-45deg); font-size: 13px; }
        .brand-name { font-size: 15px; font-weight: 700; white-space: nowrap; }
        .app-bar__meta {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            flex: 1 1 auto;
            min-width: 0;
        }
        .network-pill,
        .endpoint-chip,
        .wallet-chip,
        .wallet-connect {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            max-width: 100%;
            min-width: 0;
            border: 1px solid var(--outline);
            border-radius: var(--radius-pill);
            background: var(--surface-container);
            color: var(--on-surface-variant);
            white-space: nowrap;
        }
        .network-pill { padding: 5px 10px; font-size: 12px; }
        .endpoint-chip {
            max-width: 210px;
            padding: 5px 10px;
            border-radius: var(--radius-base);
            overflow: hidden;
            text-overflow: ellipsis;
            font: 12px/1.35 var(--font-mono);
        }
        .wallet-chip {
            padding: 5px 12px 5px 8px;
            border-color: #cfe0fb;
            background: var(--primary-container);
            color: var(--on-primary-container);
            cursor: default;
        }
        .wallet-connect {
            padding: 7px 14px;
            border: 0;
            background: var(--primary);
            color: #fff;
            cursor: pointer;
            font-weight: 500;
        }
        .wallet-connect:hover:not(:disabled) { background: var(--primary-hover); }
        .wallet-connect:disabled { opacity: .68; cursor: not-allowed; }
        .wallet-avatar {
            width: 18px;
            height: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
        }
        .wallet-chip__name { font-weight: 500; }
        .status-dot {
            width: 7px;
            height: 7px;
            flex: 0 0 auto;
            border-radius: 50%;
            background: currentColor;
        }
        .status-dot--success { background: var(--success); }

        .app-layout {
            display: grid;
            grid-template-columns: 300px minmax(0, 1fr);
            align-items: start;
            min-width: 0;
        }
        .token-sidebar {
            position: sticky;
            top: 56px;
            height: calc(100vh - 56px);
            display: flex;
            flex-direction: column;
            min-width: 0;
            overflow: hidden;
            border-right: 1px solid var(--outline);
            background: var(--surface-container);
        }
        .token-sidebar__controls { padding: 16px 16px 10px; }
        .sidebar-heading {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
        }
        .sidebar-heading h2 {
            margin: 0;
            color: var(--on-surface-variant);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .6px;
            text-transform: uppercase;
        }
        .sidebar-heading span { color: var(--on-surface-dim); font-size: 12px; }
        .token-search { display: grid; gap: 4px; margin-bottom: 10px; }
        .token-search span {
            color: var(--on-surface-dim);
            font-size: 11px;
            font-weight: 500;
        }
        .token-search input {
            width: 100%;
            height: 36px;
            min-width: 0;
            padding: 0 12px;
            border: 1px solid var(--outline-strong);
            border-radius: var(--radius-base);
            outline: none;
            background: var(--surface-bright);
            color: var(--on-surface);
        }
        .token-search input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(34, 100, 209, .15);
        }
        .mine-toggle {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 28px;
            padding: 0;
            border: 0;
            background: transparent;
            color: #3d444e;
            cursor: pointer;
            text-align: left;
        }
        .mine-toggle__track {
            width: 34px;
            height: 20px;
            display: inline-flex;
            align-items: center;
            padding: 2px;
            border-radius: 999px;
            background: var(--neutral-chip-bg);
            border: 1px solid var(--outline-strong);
        }
        .mine-toggle__track span {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--surface-bright);
            box-shadow: 0 1px 2px rgba(0,0,0,.25);
            transition: transform .16s ease;
        }
        .mine-toggle.is-on .mine-toggle__track {
            border-color: var(--primary);
            background: var(--primary);
        }
        .mine-toggle.is-on .mine-toggle__track span { transform: translateX(14px); }
        .mine-toggle__count { margin-left: auto; color: var(--on-surface-dim); font-size: 11px; }
        .token-list-scroll {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            padding: 0 8px 12px;
        }
        .token-row {
            width: 100%;
            display: block;
            margin-bottom: 4px;
            padding: 10px;
            border: 1px solid transparent;
            border-radius: var(--radius-card);
            background: transparent;
            color: var(--on-surface);
            cursor: pointer;
            text-align: left;
        }
        .token-row:hover { background: #f9fafc; }
        .token-row.is-active {
            border-color: #bcd6f7;
            background: var(--primary-container);
        }
        .token-row__top {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }
        .kind-dot {
            width: 8px;
            height: 8px;
            flex: 0 0 auto;
            border-radius: 2px;
            background: var(--outline-strong);
            transform: rotate(45deg);
        }
        .token-row.is-active .kind-dot { background: var(--primary); }
        .token-row__meta {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 6px;
            padding-left: 16px;
            color: var(--on-surface-dim);
            font-size: 11px;
        }
        .pending-count { color: var(--warning); font-weight: 500; }
        .mine-badge {
            flex: 0 0 auto;
            border-radius: 4px;
            padding: 1px 5px;
            background: var(--success-bg);
            color: var(--success-text);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .4px;
        }
        .token-sidebar__footer {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            padding: 10px 12px 14px;
            border-top: 1px solid var(--outline);
            background: var(--surface-container);
        }

        .workspace {
            width: 100%;
            max-width: 1160px;
            min-width: 0;
            padding: 20px 24px 64px;
        }
        .material-alert,
        .write-status-banner {
            min-width: 0;
            border: 1px solid var(--outline);
            border-radius: var(--radius-card);
            background: var(--surface-bright);
        }
        .material-alert--info {
            border-color: #bfd3f3;
            background: var(--primary-container);
            color: var(--on-primary-container);
        }
        .material-alert--success {
            border-color: #b7e0c6;
            background: var(--success-bg);
            color: var(--success-text);
        }
        .material-alert--warning {
            border-color: #ecd39b;
            background: var(--warning-bg);
            color: var(--warning-text);
        }
        .material-alert--error {
            border-color: #f0c3bd;
            background: var(--error-bg);
            color: var(--error-text);
        }
        .write-status-banner {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            padding: 12px 14px;
            box-shadow: 0 1px 2px rgba(25, 28, 32, .05);
        }
        .write-status-banner__leading,
        .write-status-banner__body,
        .write-status-banner__actions,
        .write-status-banner__detail {
            min-width: 0;
        }
        .write-status-banner__leading,
        .write-status-banner__actions {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex: 0 0 auto;
        }
        .write-status-banner__body {
            flex: 1 1 auto;
            color: inherit;
        }
        .write-status-banner__detail {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            overflow-wrap: anywhere;
            font-weight: 500;
        }
        .write-status-banner__spinner {
            width: 16px;
            height: 16px;
            flex: 0 0 auto;
            border: 2px solid currentColor;
            border-right-color: transparent;
            border-radius: 50%;
            animation: write-status-spin .8s linear infinite;
        }
        .write-status-banner__link {
            color: inherit;
            font-weight: 700;
            text-decoration: underline;
            text-underline-offset: 2px;
        }
        .write-status-banner__dismiss {
            width: 28px;
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid currentColor;
            border-radius: var(--radius-base);
            background: transparent;
            color: inherit;
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
        }
        .write-status-banner__dismiss:hover { background: rgba(255, 255, 255, .5); }
        @keyframes write-status-spin {
            to { transform: rotate(360deg); }
        }
        .token-header {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            flex-wrap: wrap;
            margin-bottom: 6px;
        }
        .token-heading { min-width: 0; flex: 1 1 320px; }
        .token-title-line,
        .owner-line,
        .token-header__actions {
            display: flex;
            align-items: center;
            gap: 10px;
            row-gap: 8px;
            flex-wrap: wrap;
            min-width: 0;
        }
        .token-title-line h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
        }
        .owner-line {
            margin-top: 10px;
            color: var(--on-surface-variant);
        }
        .token-header__actions { justify-content: flex-end; }
        .summary-strip {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 1px;
            margin: 16px 0 22px;
            overflow: hidden;
            border: 1px solid var(--outline);
            border-radius: var(--radius-card);
            background: var(--outline);
        }
        .summary-cell {
            min-width: 0;
            padding: 12px 14px;
            background: var(--surface-bright);
        }
        .summary-label {
            margin-bottom: 6px;
            color: var(--on-surface-dim);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .5px;
            text-transform: uppercase;
        }
        .summary-value { font-size: 15px; font-weight: 500; }
        .workspace-tabs {
            display: flex;
            align-items: center;
            gap: 4px;
            min-width: 0;
            margin-bottom: 18px;
            border-bottom: 1px solid var(--outline);
        }
        .workspace-tab {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            min-height: 38px;
            margin-bottom: -1px;
            padding: 0 12px;
            border: 0;
            border-bottom: 2px solid transparent;
            background: transparent;
            color: var(--on-surface-variant);
            cursor: pointer;
            font-weight: 500;
        }
        .workspace-tab:hover,
        .workspace-tab.is-active {
            border-bottom-color: var(--primary);
            color: var(--primary);
        }
        .tab-count {
            min-width: 20px;
            padding: 2px 7px;
            border-radius: 999px;
            background: var(--neutral-chip-bg);
            color: var(--neutral-chip-text);
            font-size: 11px;
        }
        .workspace-tab.is-active .tab-count {
            background: var(--primary-container);
            color: var(--on-primary-container);
        }
        .placeholder-panel {
            min-width: 0;
            padding: 44px 20px;
            border: 1px solid var(--outline);
            border-radius: var(--radius-card);
            background: var(--surface-bright);
            color: var(--on-surface-dim);
            text-align: center;
        }
        .placeholder-panel h1,
        .placeholder-panel h2 {
            margin: 0 0 4px;
            color: var(--on-surface-variant);
            font-size: 17px;
        }
        .placeholder-panel p { margin: 0 auto 16px; max-width: 48ch; }
        .empty-glyph {
            margin-bottom: 8px;
            color: var(--outline-strong);
            font: 500 26px/1 var(--font-mono);
        }
        .placeholder-panel--empty { margin-top: 24px; }

        .material-paper {
            min-width: 0;
            overflow: hidden;
            border: 1px solid var(--outline);
            border-radius: var(--radius-card);
            background: var(--surface-bright);
        }
        .facts-panel__header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 10px 14px;
            border-bottom: 1px solid var(--outline);
            background: var(--surface-container);
        }
        .facts-panel__eyebrow,
        .facts-panel__count {
            color: var(--on-surface-variant);
            font-size: 12px;
        }
        .facts-panel__proof-summary {
            margin-top: 2px;
            color: var(--on-surface-dim);
            font-size: 11px;
        }
        .facts-panel__count {
            flex: 0 0 auto;
            color: var(--on-surface-dim);
        }
        .facts-table-shell {
            width: 100%;
            max-width: 100%;
            min-width: 0;
            overflow-x: auto;
        }
        .material-data-table-container {
            min-width: 760px;
            overflow: visible;
        }
        .material-data-table {
            width: 100%;
            min-width: 760px;
            border-collapse: collapse;
            font-size: 13px;
        }
        .material-data-table th {
            padding: 9px 14px;
            border-bottom: 1px solid var(--outline);
            color: var(--on-surface-dim);
            font-size: 11px;
            font-weight: 600;
            text-align: left;
            text-transform: uppercase;
        }
        .material-data-table th[data-column="proof"],
        .material-data-table th[data-column="actions"] {
            white-space: nowrap;
        }
        .material-data-table th[data-column="actions"] { text-align: right; }
        .material-data-table td {
            min-width: 0;
            padding: 12px 14px;
            border-bottom: 1px solid #eef1f5;
            vertical-align: top;
        }
        .material-data-table tr:hover td { background: #f9fafc; }
        .material-data-table td:nth-child(1) { width: 26%; min-width: 210px; }
        .material-data-table td:nth-child(2) { width: 44%; min-width: 300px; }
        .material-data-table td:nth-child(3) { width: 120px; white-space: nowrap; }
        .material-data-table td:nth-child(4) {
            width: 150px;
            text-align: right;
            white-space: nowrap;
        }
        .fact-key-cell { min-width: 0; }
        .fact-key-label {
            margin-bottom: 5px;
            color: var(--on-primary-container);
            font-weight: 600;
        }
        .fact-json-well {
            display: block;
            max-width: 100%;
            min-width: 0;
            overflow: auto;
            border: 1px solid #eef1f5;
            border-radius: 5px;
            background: var(--surface-container);
            color: var(--on-surface);
            font: 12px/1.45 var(--font-mono);
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
        .fact-json-well--key {
            max-width: 250px;
            padding: 4px 7px;
            color: var(--on-surface-variant);
        }
        .fact-json-well--value {
            max-width: 420px;
            max-height: 96px;
            padding: 6px 8px;
        }
        .status-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 9px;
            border: 1px solid var(--outline-strong);
            border-radius: 14px;
            background: var(--neutral-chip-bg);
            color: var(--neutral-chip-text);
            font-size: 12px;
            font-weight: 500;
        }
        .status-chip::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: currentColor;
        }
        .status-chip--ok {
            border-color: #b7e0c6;
            background: var(--success-bg);
            color: var(--success-text);
        }
        .status-chip--warn {
            border-color: #ecd39b;
            background: var(--warning-bg);
            color: var(--warning-text);
        }
        .status-chip--error {
            border-color: #f0c3bd;
            background: var(--error-bg);
            color: var(--error-text);
        }
        .status-chip--neutral {
            border-color: var(--outline);
            background: var(--neutral-chip-bg);
            color: var(--neutral-chip-text);
        }
        .material-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            max-width: 100%;
            padding: 3px 9px;
            border: 1px solid var(--outline);
            border-radius: 14px;
            background: var(--neutral-chip-bg);
            color: var(--neutral-chip-text);
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
        }
        .material-chip--primary {
            border-color: #bcd6f7;
            background: #e2eefb;
            color: var(--on-primary-container);
        }
        .material-chip--success {
            border-color: #b7e0c6;
            background: var(--success-bg);
            color: var(--success-text);
        }
        .material-chip--warning {
            border-color: #ecd39b;
            background: var(--warning-bg);
            color: var(--warning-text);
        }
        .material-chip--error {
            border-color: #f0c3bd;
            background: var(--error-bg);
            color: var(--error-text);
        }
        .material-chip__leading {
            width: 7px;
            height: 7px;
            flex: 0 0 auto;
            display: inline-flex;
        }
        .pending-chip-dot {
            width: 7px;
            height: 7px;
            display: block;
            border-radius: 50%;
            background: currentColor;
        }
        .material-button {
            min-height: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 0 10px;
            border-radius: var(--radius-base);
            cursor: pointer;
            font-weight: 500;
        }
        .material-button--secondary {
            border: 1px solid var(--outline-strong);
            background: var(--surface-bright);
            color: #3d444e;
        }
        .material-button--secondary:hover:not(:disabled) { background: #f1f3f6; }
        .material-button:disabled {
            opacity: .58;
            cursor: not-allowed;
        }
        .fact-actions {
            display: inline-flex;
            align-items: flex-end;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 6px;
            max-width: 170px;
