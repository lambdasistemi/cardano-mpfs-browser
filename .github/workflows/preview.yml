name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [epic/72-ui-redesign]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.event.action != 'closed'
    runs-on: nixos
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/cachix-action@v15
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build SPA bundle
        run: nix develop --quiet --command bash -c 'npm ci && just bundle'

      - name: Point preview at live UMPFS
        run: printf 'window.MPFS_BASE_URL = "https://umpfs.plutimus.com";\n' > dist/config.js

      - name: Cache-bust asset refs
        run: |
          ver="${GITHUB_SHA::8}"
          sed -i "s#src=\"index.js\"#src=\"index.js?v=$ver\"#; s#src=\"config.js\"#src=\"config.js?v=$ver\"#" dist/index.html

      - name: Verify cage config
        run: nix develop --quiet --command just verify-cage-config

      - name: Publish PR preview
        uses: paolino/dev-assets/static-preview@main
        with:
          path: dist
          pr-number: ${{ github.event.number || 'epic-72' }}
          comment: ${{ github.event_name == 'pull_request' }}
          comment-marker: "<!-- mpfs-spa-preview-url -->"

  cleanup:
    if: github.event.action == 'closed'
    runs-on: nixos
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: paolino/dev-assets/static-preview@main
        with:
          mode: cleanup
          comment-marker: "<!-- mpfs-spa-preview-url -->"
